name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: git pull --rebase origin main || true

      - name: Generate authenticated stats SVGs
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: https://github-readme-stats-sigma-five.vercel.app
          USER: umer-jahangier
        run: |
          set -euo pipefail
          mkdir -p dist/stats
          AUTH="username=${USER}&hide_border=true&include_all_commits=true&count_private=true&token=${TOKEN}"
          LANGS="layout=compact&langs_count=6&card_width=495&card_height=195&hide=html,css,scss,ejs,nsis"
          strip_undefined() { sed -i '/^[[:space:]]*undefined[[:space:]]*$/d' "$1"; }

          curl -fsSL "${BASE}/api?${AUTH}&show_icons=true&theme=default&bg_color=ffffff&title_color=ff0080&icon_color=bf00ff&text_color=24292f&border_color=eaeef2" \
            -o dist/stats/stats-light.svg
          curl -fsSL "${BASE}/api?${AUTH}&show_icons=true&theme=radical&bg_color=0d1117&title_color=00fff5&icon_color=ff0080&text_color=c9d1d9" \
            -o dist/stats/stats-dark.svg

          curl -fsSL "${BASE}/api/top-langs/?${AUTH}&${LANGS}&theme=default&bg_color=ffffff&title_color=ff0080&text_color=24292f" \
            -o dist/stats/langs-light.svg
          curl -fsSL "${BASE}/api/top-langs/?${AUTH}&${LANGS}&theme=radical&bg_color=0d1117&title_color=00fff5&text_color=c9d1d9" \
            -o dist/stats/langs-dark.svg

          strip_undefined dist/stats/stats-light.svg
          strip_undefined dist/stats/stats-dark.svg
          strip_undefined dist/stats/langs-light.svg
          strip_undefined dist/stats/langs-dark.svg

          python3 scripts/generate-streak-svg.py dist/stats

          for f in dist/stats/*.svg; do
            test -s "$f" || { echo "Empty or missing: $f"; exit 1; }
            grep -q 'undefined' "$f" && { echo "Found undefined text in $f"; exit 1; }
          done

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/stats/
          git diff --staged --quiet || git commit -m "chore: update authenticated GitHub stats"
          git push
