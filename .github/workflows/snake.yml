name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: umer-jahangier
          outputs: |
            dist/github-snake.svg?color_snake=ff0080&color_dots=#0d0221,#3d0066,#7c0088,#ff0080,#00fff5&color_background=000000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00fff5
            dist/github-snake.gif?color_snake=ff0080&color_dots=#0d0221,#3d0066,#7c0088,#ff0080,#00fff5&color_background=000000

      - name: Commit snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add dist/
          git diff --staged --quiet || git commit -m "chore: update contribution snake animation"
          git push
